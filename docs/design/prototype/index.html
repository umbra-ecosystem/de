<title>de Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: three fixed columns (places | work | facts), a slim top bar and a pinned "now" bar.
   Low-fi wireframe language: grey surfaces, one accent for primary actions, colour only for risk and state. */
:root{
  --bg:#e9ecf1; --panel:#f5f6f9; --surface:#ffffff; --ink:#18202d; --mute:#586275; --faint:#8f99aa;
  --line:#d5dae3; --line-strong:#aeb7c5; --fill:#e6e9ef; --accent:#0d6b63; --accent-ink:#ffffff; --accent-soft:#d3ebe8;
  --ok:#1d7a43; --ok-soft:#dbf0e2; --warn:#96600a; --warn-soft:#f8ebd1; --bad:#b3261e; --bad-soft:#f7dddb; --bad-ink:#ffffff;
  --dim:rgba(18,24,34,.5); --diff-add:#e3f4e8; --diff-del:#fbe5e3; --sel:#fff7d1;
  --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --panel:#181c24; --surface:#1f2430; --ink:#e6e9ef; --mute:#a3adbc; --faint:#6d7889;
  --line:#313847; --line-strong:#485163; --fill:#2a303d; --accent:#3fb8ab; --accent-ink:#06211e; --accent-soft:#17403c;
  --ok:#5cc48a; --ok-soft:#173a27; --warn:#e2a94a; --warn-soft:#3f3018; --bad:#f0857e; --bad-soft:#452321; --bad-ink:#2a0c0a;
  --dim:rgba(0,0,0,.62); --diff-add:#173123; --diff-del:#3a2020; --sel:#4a4322; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#181c24; --surface:#1f2430; --ink:#e6e9ef; --mute:#a3adbc; --faint:#6d7889;
  --line:#313847; --line-strong:#485163; --fill:#2a303d; --accent:#3fb8ab; --accent-ink:#06211e; --accent-soft:#17403c;
  --ok:#5cc48a; --ok-soft:#173a27; --warn:#e2a94a; --warn-soft:#3f3018; --bad:#f0857e; --bad-soft:#452321; --bad-ink:#2a0c0a;
  --dim:rgba(0,0,0,.62); --diff-add:#173123; --diff-del:#3a2020; --sel:#4a4322; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
h2,h3,h4,h5{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12px}.key{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);text-decoration:none}
a.key:hover{text-decoration:underline}
.key.big{font-size:15px}
.mute{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:12px}
.pad{padding:6px 2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.sb{justify-content:space-between;flex-wrap:nowrap}.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
#root{height:100dvh}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 332px;height:100dvh}
.app.noright{grid-template-columns:232px minmax(0,1fr)}
.app.noright .right{display:none}
.left,.right{overflow:auto;background:var(--panel);min-height:0}
.left{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.right{border-left:1px solid var(--line);padding:12px 12px 24px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.content{overflow:auto;flex:1;padding:18px 24px 48px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 10px}
.logo{font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:-.02em}
.proto{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 8px;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;color:var(--mute);text-decoration:none}
.nav b{font-weight:500;font-size:12px;color:var(--faint);font-family:var(--mono)}
.nav:hover{background:var(--fill);color:var(--ink)}
.nav.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line-strong)}
.grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 10px 4px;font-weight:600}
.prov{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.hp{display:flex;align-items:center;gap:7px}.hp em{margin-left:auto;font-style:normal;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.fresh{color:var(--faint);font-size:12px}.warn-t{color:var(--warn)}

.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb i{font-style:normal;color:var(--faint)}.crumb b{font-weight:600}.crumb a{color:var(--mute);text-decoration:none}
.crumb .ct{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.search{display:flex;gap:8px;align-items:center;background:var(--fill);border:1px solid transparent;border-radius:6px;padding:5px 10px;color:var(--faint);min-width:210px}
.search:hover{border-color:var(--line-strong)}
kbd{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:auto}
.icon{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;color:var(--mute)}
.icon:hover{background:var(--fill)}
.mob{display:none}
.now{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.now .nt{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.d{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.g{background:transparent;border-color:transparent;color:var(--mute)}
.btn.g:hover:not(:disabled){background:var(--fill);border-color:transparent}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45}
.lnk{color:var(--accent);text-decoration:none}.lnk:hover{text-decoration:underline}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.hot{background:var(--bad);color:var(--bad-ink)}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--surface)}
.card.overlay{background:var(--warn-soft);border-color:var(--warn);color:var(--ink);margin-top:8px}
.warn-box{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:7px 10px;margin:6px 0;font-size:13px}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:26px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty.left{align-items:flex-start;text-align:left;background:var(--surface)}
.empty b{color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.chk.big{color:var(--ink);font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.strike{text-decoration:line-through;color:var(--faint)}
.radio{display:flex;gap:8px;align-items:center;padding:6px 0}
.in,textarea{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:6px;padding:6px 9px;font:inherit}
textarea{resize:vertical;min-height:70px}
textarea.mono{font-family:var(--mono);font-size:12px}
.in{width:auto;min-width:160px}.in.big{width:100%;font-size:15px;padding:10px 12px}.in.ro{display:inline-block;color:var(--mute);border-style:dashed}
.lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:14px 0 6px}
.lede{color:var(--mute);margin:4px 0 14px;max-width:74ch}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700;margin-bottom:8px}
h4{font-size:13px;margin:12px 0 4px}
.dotnew{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);vertical-align:middle}
.spin{width:11px;height:11px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- tables and tabs ---- */
.tbwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hover{cursor:pointer}.tbl tr.hover:hover td{background:var(--fill)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 14px;flex-wrap:wrap}
.tabs a{padding:6px 12px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.tabs.sm a{padding:4px 10px;font-size:13px}.tabs a b{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:3px 12px;font-family:var(--mono);font-size:12px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---- next / suggestions ---- */
.card.sug{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 14px}
.card.sug.res{border-color:var(--accent)}
.card.sug.muted{opacity:.55}
.rk{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--mute);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.sug .tt{font-weight:600}
.why{color:var(--mute);margin:3px 0 9px}
.dim-card{position:relative}

/* ---- ticket ---- */
.thead .tt2{margin-top:4px;font-size:21px}
.tbody{margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.col{min-width:0}.sec{margin-bottom:20px}
.prose p{margin:0 0 8px;max-width:75ch}.prose ul{margin:0 0 8px;padding-left:20px}
.code{font-family:var(--mono);font-size:12px;background:var(--fill);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
ul.ac{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.cmt{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;background:var(--surface)}
.cmt.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cbody p{margin:4px 0 0}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.mention{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;font-weight:600}
.mention.me{background:var(--accent);color:var(--accent-ink)}
.url{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.composer{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.att{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.fileic{color:var(--faint)}
.qi{padding:6px 0;border-bottom:1px solid var(--line)}.qi:last-child{border-bottom:0}
.stepper{list-style:none;display:flex;gap:0;padding:0;margin:12px 0 0;overflow-x:auto}
.stepper li{flex:1;min-width:74px;text-align:center;position:relative;font-size:11px;color:var(--faint);padding-top:16px}
.stepper li i{position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);z-index:1}
.stepper li::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line-strong)}
.stepper li:first-child::before{display:none}
.stepper li.done{color:var(--ok)}.stepper li.done i{background:var(--ok);border-color:var(--ok)}.stepper li.done::before{background:var(--ok)}
.stepper li.now{color:var(--ink);font-weight:700}.stepper li.now i{border-color:var(--accent);background:var(--accent-soft)}
.stepper li.now::before{background:var(--ok)}

/* ---- review ---- */
.prhead{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:10px 0;background:var(--surface);display:flex;flex-direction:column;gap:3px}
.rvgrid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px}
.ftree{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.fl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;word-break:break-all}
.fl:hover{background:var(--fill)}.fl.on{background:var(--surface);border-color:var(--line-strong)}
.fl em{font-style:normal;font-family:var(--mono);font-size:11px}.ad{font-style:normal;color:var(--ok)}.dl2{font-style:normal;color:var(--bad)}
.fpath{margin-bottom:6px}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;overflow:auto;background:var(--surface)}
.dl{display:grid;grid-template-columns:38px 38px 16px minmax(0,1fr) 28px;padding:0 6px;white-space:pre;position:relative}
.dl code{font-family:inherit;white-space:pre-wrap;word-break:break-word}
.dl.add{background:var(--diff-add)}.dl.del{background:var(--diff-del)}
.dl .ln{color:var(--faint);text-align:right;padding-right:8px;user-select:none}
.dl .sg{color:var(--mute)}
.dl .plus{opacity:0;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;width:20px;height:18px;line-height:16px;align-self:center;padding:0}
.dl:hover .plus{opacity:1}
.thread{font-family:var(--ui);font-size:12.5px;margin:4px 10px 6px 80px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--panel);white-space:normal}
.thread.new{border-color:var(--accent)}
.rvbar{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ---- ship ---- */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute)}
.step.now .n{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step.done .n{border-color:var(--ok);color:var(--ok)}
.step.bad .n{border-color:var(--bad);color:var(--bad)}
.sb2{display:flex;flex-direction:column;gap:8px;min-width:0}

/* ---- uat contents ---- */
.colsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.envcol{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.envit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:3px}

/* ---- right sidebar ---- */
.rc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.rc h5{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;align-items:baseline}
.kv span{color:var(--mute);flex:none}.kv b{font-weight:500;text-align:right;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
ul.act,ul.rep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
ul.act li{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}ul.act em{font-style:normal;color:var(--mute);font-family:var(--mono);font-size:11px}
ul.rep li{display:flex;gap:7px;align-items:baseline}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:var(--dim);z-index:40}
.sheet{position:fixed;z-index:50;left:50%;top:9vh;transform:translateX(-50%);width:min(580px,94vw);max-height:84vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 28px 60px -14px rgba(0,0,0,.55);display:flex;flex-direction:column}
.sheet.wide{width:min(720px,94vw)}
.sheet.pal{top:14vh;padding:10px;gap:8px}
.pal-l{display:flex;flex-direction:column}.pi{text-align:left;background:transparent;border:0;padding:8px 10px;border-radius:6px}.pi:hover,.pi:focus{background:var(--fill)}
.sh-h{padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.sh-h.high{background:var(--bad-soft);color:var(--bad);border-bottom-color:var(--bad)}
.sh-h.medium{background:var(--warn-soft);color:var(--warn)}
.sh-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sh-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);position:sticky;bottom:0}
.ps{display:flex;gap:10px;align-items:baseline;color:var(--faint)}.ps i{font-style:normal;width:16px;text-align:center}
.ps.run{color:var(--ink)}.ps.ok{color:var(--ink)}.ps.ok i{color:var(--ok)}.ps.warn i{color:var(--warn)}
.dev{position:fixed;z-index:45;right:14px;bottom:14px;width:min(320px,92vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}
.dev .lab{margin:10px 0 4px}
ol.try{margin:0;padding-left:18px;color:var(--mute);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.toasts{position:fixed;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 14px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.toast.ok{background:var(--ok);color:var(--accent-ink)}.toast.bad{background:var(--bad);color:var(--bad-ink)}.toast.warn{background:var(--warn);color:var(--surface)}

@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.app .right{display:none}.grid3{grid-template-columns:1fr}}
@media (max-width:820px){
  .app,.app.noright{grid-template-columns:minmax(0,1fr)}
  .left{position:fixed;z-index:30;left:0;top:0;bottom:0;width:250px;transform:translateX(-102%);transition:transform .18s;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .showleft .left{transform:none}
  .mob{display:inline-block}.search span,.search kbd{display:none}.search{min-width:0}
  .grid2,.rvgrid{grid-template-columns:minmax(0,1fr)}
  .content{padding:14px 14px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ticket facts move into the Overview whenever the right sidebar is not on screen */
.narrow-only{display:none}
.app.noright .narrow-only{display:block}

   A small in-memory stand-in for de-core: state, the lifecycle actions the real core exposes,
   fake sync, fake pipelines, and a simplified copy of the next-action rules. No I/O, no network. */

const MS_PER_MIN = 4000;            // one simulated minute per 4 real seconds
const START_MIN = 9 * 60 + 40;      // the simulated day starts at 09:40

function newState() {
  return {
    ms: 0, seq: 100, run: 480,
    sync: { running: false, lastOk: -2 * MS_PER_MIN, lastAttempt: -2 * MS_PER_MIN, lastError: null, report: [], script: 0 },
    providers: { jira: { ready: true }, bkt: { ready: true } },
    sim: { offline: false, conflict: null, leak: null, uatMoved: false, failDeploy: null },
    ws: {
      branches: { 'api-client': 'develop', web: 'wip/my-experiment', worker: 'develop', docs: 'master' },
      dirty: { web: true },
      up: true,
    },
    tickets: seedTickets(), audit: [], responses: {}, order: null,
    ui: { route: { name: 'next' }, sheet: null, toasts: [], dev: false, right: true, left: false, showAllSug: false, drafts: {}, prSel: {}, fileSel: {}, palette: null },
  };
}
let S = newState();
const script = syncScript();

/* ---------------------------- helpers ---------------------------- */
const tk = (k) => S.tickets.find((t) => t.key === k);
const status = (t) => (t.local ? t.local.status : null);
const activeTicket = () => S.tickets.find((t) => status(t) === 'active');
const clock = () => { const m = START_MIN + Math.floor(S.ms / MS_PER_MIN); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const minsAgo = (ms) => Math.max(0, Math.floor((S.ms - ms) / MS_PER_MIN));
const nextSeq = () => ++S.seq;
const hex = (s) => { let h = 5381; for (const c of String(s)) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(0, 7); };
const isHotfix = (t) => t.prs.some((p) => REPOS[p.repo].prod !== REPOS[p.repo].base && p.dst === REPOS[p.repo].prod);
const mentionsMe = (c) => c.body.some((b) => (b.t === 'p' && /@\[you\]/i.test(b.x)));
const maxN = (t) => t.comments.reduce((m, c) => Math.max(m, c.n), 0);
const unseenMentions = (t) => t.comments.filter((c) => c.n > t.seenN && c.who !== ME && mentionsMe(c));
const unseenCount = (t) => t.comments.filter((c) => c.n > t.seenN && c.who !== ME).length;
const durationMs = (t) => t.timeMs + (t.act ? S.ms - t.act.startedMs : 0);
const fmtDur = (ms) => { const m = Math.floor(ms / MS_PER_MIN); return m >= 60 ? Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + 'm'; };
const isSignedOff = (t) => JIRA.signed.includes(t.jira);

function audit(action, ticket, repo, outcome, details) {
  S.audit.unshift({ id: nextSeq(), at: clock(), action, ticket: ticket || null, repo: repo || null, outcome: outcome || 'success', details: details || '' });
}
function toast(msg, kind) { S.ui.toasts.push({ id: nextSeq(), msg, kind: kind || 'info', until: S.ms + 6000 }); }

/* which repos a ticket touches (has a ticket branch), which are ambiguous */
function repoPlan(t) {
  return Object.keys(REPOS).map((repo) => {
    const cands = t.cands[repo] || [];
    const excluded = !!t.excl[repo];
    const manual = t.link[repo] || null;
    const chosen = excluded ? null : manual || (cands.length === 1 ? cands[0] : null);
    return { repo, cands, excluded, manual, chosen, ambiguous: !excluded && !manual && cands.length > 1 };
  }).filter((p) => p.cands.length || p.excluded);
}
const touchedRepos = (t) => repoPlan(t).filter((p) => p.chosen);

}
function startReview(key) {

}

}
function toggleChecklist(key, i) { const t = tk(key); t.checklist[i].done = !t.checklist[i].done; }

function untrackDone(key) { const t = tk(key); t.local = { status: 'done' }; audit('ticket.done', key); }

/* ---------------------------- activation ---------------------------- */
const baselineFor = (repo, hotfix, choice) => {
  if (!hotfix) return REPOS[repo].base;
  return choice === 'production' ? REPOS[repo].prod : choice === 'uat' ? 'uat' : REPOS[repo].base;
};
function activationPlan(t, choice) {
  const errors = []; const rows = [];
  const plans = Object.fromEntries(repoPlan(t).map((p) => [p.repo, p]));
  for (const repo of Object.keys(REPOS)) {
    const p = plans[repo];
    if (p && p.ambiguous) errors.push(repo + ': ' + p.cands.length + ' branches match ' + t.key + '. Choose one on the Overview tab.');
    if (p && p.chosen) rows.push({ repo, role: 'ticket', branch: p.chosen });
    else rows.push({ repo, role: 'baseline', branch: baselineFor(repo, isHotfix(t), choice) });
  }
  const overlayRow = rows.find((r) => REPOS[r.repo].overlayConsumer && rows.find((x) => x.repo === REPOS[r.repo].consumes && x.role === 'ticket'));
  const overlay = overlayRow ? { repo: overlayRow.repo, provider: REPOS[overlayRow.repo].consumes } : null;
  return { errors, rows, overlay };
}
function activate(key, choice) {
  const t = tk(key);
  if (!t || !t.local) return { ok: false, errors: ['Claim the ticket first.'] };
  const other = activeTicket();
  if (other) return { ok: false, errors: [other.key + ' is already active. Park or finish it first.'] };
  if (!['claimed', 'reviewing', 'parked', 'integrated'].includes(status(t))) return { ok: false, errors: ['A ' + status(t) + ' ticket cannot be activated.'] };
  if (isHotfix(t) && !choice) return { ok: false, needBaseline: true };
  const plan = activationPlan(t, choice);
  if (plan.errors.length) return { ok: false, errors: plan.errors };
  audit('activation.start', key);
  const records = []; const warnings = [];
  for (const r of plan.rows) {
    const prev = S.ws.branches[r.repo]; const stash = !!S.ws.dirty[r.repo];
    S.ws.branches[r.repo] = r.branch; if (stash) S.ws.dirty[r.repo] = false;
    records.push({ repo: r.repo, role: r.role, branch: r.branch, prev, stash, label: stash ? 'de:' + key + ':' + r.repo : null });
    audit('activation.repo_switched', key, r.repo, 'success', (r.role === 'ticket' ? 'ticket branch ' : 'baseline ') + r.branch);
  }
  if (plan.overlay) audit('overlay.apply', key, plan.overlay.repo, 'success', 'composer path repository -> ../' + plan.overlay.provider + ', constraint "*"');
  t.act = { startedMs: S.ms, records, overlay: plan.overlay, choice: choice || null };
  t.local.status = 'active'; t.prep = null;
  audit('activation.complete', key);
  return { ok: true, rows: plan.rows, records, overlay: plan.overlay, warnings };
}
function deactivate(key, target, by) {
  const t = tk(key);
  if (!t || !t.act) return { ok: false, errors: ['Nothing to restore for ' + key + '.'] };
  const restored = []; let overlayReverted = null;
  if (t.act.overlay) { overlayReverted = t.act.overlay; audit('overlay.revert', key, t.act.overlay.repo, 'success', 'composer.json and composer.lock restored, composer install run'); }
  for (const r of [...t.act.records].reverse()) {
    S.ws.branches[r.repo] = r.prev; if (r.stash) S.ws.dirty[r.repo] = true;
    restored.push({ repo: r.repo, to: r.prev, stash: r.label });
    audit('deactivation.repo_restored', key, r.repo, 'success', 'back on ' + r.prev + (r.stash ? ', stash popped' : ''));
  }
  t.timeMs += S.ms - t.act.startedMs; t.act = null;
  t.local.status = target || 'parked';
  audit(by === 'finalize' ? 'integration.finalize' : 'deactivation.complete', key);
  return { ok: true, restored, overlayReverted };
}

/* ---------------------------- integration ---------------------------- */
function prepare(key) {
  const t = tk(key);
  if (!t || status(t) !== 'active') return { ok: false, error: 'The ticket must be active (tested locally) before it can be integrated.' };
  const rows = touchedRepos(t).map((p) => {
    const repo = p.repo;
    const done = t.merges.find((m) => m.repo === repo);
    if (done) return { repo, outcome: 'alreadyPushed', commit: done.commit };
    if (S.sim.conflict === repo) return { repo, outcome: 'conflict', files: ['src/session.rs'], with: 'PROJ-127' };
    if (S.sim.leak === repo) return { repo, outcome: 'blocked', reason: 'overlay leak: composer.json adds a path repository (commit ' + hex('leak' + repo) + ')' };
    const files = t.prs.filter((x) => x.repo === repo).flatMap((x) => x.files);
    const overlaps = [];
    for (const o of S.tickets) {
      if (o.key === t.key || !o.merges.some((m) => m.repo === repo)) continue;
      for (const f of o.prs.filter((x) => x.repo === repo).flatMap((x) => x.files)) if (files.some((g) => g.path === f.path)) overlaps.push({ key: o.key, file: f.path });
    }
    return { repo, outcome: 'ready', branch: p.chosen, commits: 2 + files.length, files: files.length, uatBefore: hex('u' + repo + S.seq), merge: hex('m' + repo + key + S.seq), overlaps };
  });
  t.prep = { at: S.ms, rows };
  audit('integration.prepare', key, null, rows.every((r) => r.outcome === 'ready' || r.outcome === 'alreadyPushed') ? 'success' : 'failure', rows.map((r) => r.repo + ':' + r.outcome).join(' '));
  return { ok: true, prep: t.prep };
}
const prepPushable = (t) => !!t.prep && t.prep.rows.some((r) => r.outcome === 'ready') && t.prep.rows.every((r) => r.outcome === 'ready' || r.outcome === 'alreadyPushed');
function push(key) {
  const t = tk(key); const prep = t && t.prep;
  if (!prep || !prepPushable(t)) return { ok: false, error: 'Nothing is ready to push. Prepare the integration again.' };
  audit('git.push_uat.attempted', key, null, 'skipped', prep.rows.map((r) => r.repo + ' ' + (r.merge || r.commit) + ':refs/heads/uat').join('; '));
  const results = [];
  for (const r of prep.rows) {
    if (r.outcome === 'alreadyPushed') { results.push({ repo: r.repo, result: 'AlreadyPushed' }); continue; }
    if (S.sim.uatMoved) {
      results.push({ repo: r.repo, result: 'Rejected', reason: 'uat moved on the remote since you prepared' });
      audit('git.push_uat.repo', key, r.repo, 'failure', 'rejected: uat moved'); S.sim.uatMoved = false; t.prep = null; break;
    }
    t.merges.push({ repo: r.repo, commit: r.merge, at: clock() });
    t.deploy[r.repo] = { state: 'pending', run: ++S.run, since: S.ms, step: 'Queued' };
    results.push({ repo: r.repo, result: 'Pushed', commit: r.merge });
    audit('git.push_uat.repo', key, r.repo, 'success', r.uatBefore + ' -> ' + r.merge);
  }
  const allPushed = touchedRepos(t).every((p) => t.merges.some((m) => m.repo === p.repo));
  let finalized = false;
  if (allPushed && results.every((x) => x.result === 'Pushed' || x.result === 'AlreadyPushed')) {
    audit('git.push_uat', key, null, 'success', results.length + ' repos');
    deactivate(key, 'integrated', 'finalize'); t.prep = null; finalized = true;
  } else audit('git.push_uat', key, null, 'failure', 'not every repo was pushed');
  return { ok: true, results, finalized };
}
function rerun(key, repo) {
  const t = tk(key); const d = t && t.deploy[repo]; if (!d) return { ok: false };
  d.run = ++S.run; d.state = 'pending'; d.since = S.ms; d.step = 'Queued'; if (S.sim.failDeploy === repo) S.sim.failDeploy = null;
  audit('bitbucket.pipeline_rerun', key, repo, 'success', 'new run #' + d.run); return { ok: true };
}
function stepDeploy() {
  for (const t of S.tickets) for (const [repo, d] of Object.entries(t.deploy)) {
    if (d.state === 'deployed' || d.state === 'failed') continue;
    const el = S.ms - d.since;
    if (el < 3000) { d.state = 'pending'; d.step = 'Queued'; }
    else if (el < 8000) { d.state = 'running'; d.step = el < 5000 ? 'Build' : el < 6500 ? 'Test' : 'Deploy alpha'; }
    else {
      d.state = S.sim.failDeploy === repo ? 'failed' : 'deployed'; d.step = d.state === 'failed' ? 'Deploy alpha' : 'Deploy alpha';
      toast(t.key + ' ' + repo + ' pipeline #' + d.run + (d.state === 'failed' ? ' failed' : ' deployed to alpha'), d.state === 'failed' ? 'bad' : 'ok');
    }
  }
}
function advance(ms) { S.ms += ms; stepDeploy(); S.ui.toasts = S.ui.toasts.filter((x) => x.until > S.ms); }

const allDeployed = (t) => t.merges.length > 0 && touchedRepos(t).every((p) => t.merges.some((m) => m.repo === p.repo)) && t.merges.every((m) => t.deploy[m.repo] && t.deploy[m.repo].state === 'deployed');
const anyFailed = (t) => t.merges.filter((m) => t.deploy[m.repo] && t.deploy[m.repo].state === 'failed');
const anyRunning = (t) => t.merges.some((m) => t.deploy[m.repo] && ['pending', 'running'].includes(t.deploy[m.repo].state));

/* ---------------------------- announce ---------------------------- */
const draftOf = (t, kind) => t.drafts.filter((d) => d.kind === kind).slice(-1)[0] || null;
function composeDraft(key) {
  const t = tk(key); if (!t || !allDeployed(t)) return { ok: false, error: 'Every touched repo must be deployed first.' };
  const lines = t.merges.map((m) => { const pr = t.prs.find((p) => p.repo === m.repo); const d = t.deploy[m.repo]; return '• ' + m.repo + '  PR #' + (pr ? pr.id : '-') + ' · pipeline #' + d.run + ' · https://ci.example/' + REPOS[m.repo].host + '/' + d.run; });
  t.drafts.push({ id: 'd' + nextSeq(), kind: 'comment', body: 'Deployed to alpha:\n' + lines.join('\n'), status: 'draft' });
  audit('draft.compose', key); return { ok: true };
}

}

  if (!d || d.status !== 'posted') return { ok: false, error: 'Post the deploy comment first.' };

}
function postFreeComment(key, text) {
  const t = tk(key); t.comments.push({ n: maxN(t) + 1, who: ME, at: 'today ' + clock(), body: text.split('\n').map((x) => P(x)) });
  t.seenN = maxN(t); audit('jira.comment', key, null, 'success', 'free comment'); return { ok: true };
}

/* ---------------------------- review writes ---------------------------- */

  me.approved = true; audit('bitbucket.pr_approve', key, repo, 'success', '#' + prId);

}

/* ---------------------------- fake sync ---------------------------- */
function syncStart() {
  if (S.sync.running) return { ok: false };
  S.sync.running = true; S.sync.lastAttempt = S.ms; return { ok: true };
}
function syncFinish() {
  const report = []; S.sync.running = false;
  if (S.sim.offline) { S.sync.lastError = 'network unreachable'; S.sync.report = [{ src: 'Jira (acli)', ok: false, text: 'network unreachable, cache kept' }, { src: 'Bitbucket (bkt)', ok: false, text: 'network unreachable, cache kept' }]; audit('sync', null, null, 'failure', 'offline'); return { ok: false, report: S.sync.report }; }
  report.push({ src: 'Jira (acli)', ok: true, text: 'pool refreshed' });
  if (S.providers.bkt.ready) report.push({ src: 'Bitbucket (bkt)', ok: true, text: 'PRs and pipelines refreshed' });
  else report.push({ src: 'Bitbucket (bkt)', ok: false, text: 'signed out, cache kept. Run bkt auth login' });
  const ev = script[S.sync.script]; if (ev) { ev.apply(S); S.sync.script++; report.push({ src: 'Jira (acli)', ok: true, text: ev.text }); toast(ev.text, 'info'); }
  S.sync.lastOk = S.ms; S.sync.lastError = report.some((r) => !r.ok) ? 'partial' : null; S.sync.report = report;
  audit('sync', null, null, S.sync.lastError ? 'failure' : 'success', report.map((r) => r.text).join('; '));
  return { ok: true, report };
}
function syncNow() { syncStart(); return syncFinish(); }

/* ---------------------------- simulate (dev panel) ---------------------------- */
const SIM = {
  mention(key) { const t = tk(key); t.comments.push({ n: maxN(t) + 1, who: 'Jane Doe', at: 'today ' + clock(), body: [P('@[you] can you look at this again? It still misbehaves on staging.')] }); toast('New comment mentioning you on ' + key, 'info'); },
  signOff(key) { const t = tk(key); t.jira = 'Done'; toast(key + ' moved to Done in Jira (signed off)', 'ok'); },
  returned(key) { const t = tk(key); t.jira = JIRA.returned; t.comments.push({ n: maxN(t) + 1, who: 'Jane Doe', at: 'today ' + clock(), body: [P('Sent back. @[you] please re-check.')] }); toast(key + ' was returned in Jira', 'warn'); },
  backToReview(key) { const t = tk(key); t.jira = JIRA.review; toast(key + ' is back in the Review column', 'info'); },
  newCommits(key) { const t = tk(key); t.prs.forEach((p) => { p.updatedSeq += 1; }); t.newCommits = true; toast('New commits pushed to the branches of ' + key, 'info'); },
  toggle(name, val) { S.sim[name] = val; },

/* ============================ next-action rules ============================
   Simplified from the real engine: pure over S, ranked, each with a stated reason. */
const BANDS = { deploy_failed: 1000, integration_blocked: 990, returned_to_review: 850, returned_mention: 840, re_review: 830, start_review: 820, finish_review: 810,
  approve_prs: 690, integrate_ready: 680, push_ready: 675, compose_deploy_comment: 670, post_deploy_comment: 665, transition_alpha: 660, remerge_needed: 645,
  activate_reviewed: 640, park_active: 620, deploy_waiting: 600, claim_new: 480, adapter_unavailable: 299, sync_stale: 1200 };

function suggest() {
  const out = []; const act = activeTicket();
  const push_ = (s) => { out.push(Object.assign({ level: 'local', info: false }, s, { priority: (BANDS[s.rule] || 100) + (s.rank ? -s.rank * 10 : 0) })); };

  // sync
  const age = minsAgo(S.sync.lastOk); const sinceAttempt = minsAgo(S.sync.lastAttempt);
  if (!S.sync.running && ((S.sync.lastError && sinceAttempt >= 15) || (!S.sync.lastError && age >= 6 && sinceAttempt >= 1)))
    push_({ id: '-:sync_stale:all', ticket: null, rule: 'sync_stale', title: 'Sync now', reason: 'Data was last refreshed ' + age + ' min ago.', level: 'auto', act: { do: 'sync' }, hash: 'sync' });

  for (const t of S.tickets) {
    const st = status(t); const hot = isHotfix(t); const key = t.key;
    const need = (rule, sug) => push_(Object.assign({ ticket: key, rule, hotfix: hot }, sug));

    // returned + mentioned, or any unseen mention
    const ms = unseenMentions(t);
    if (ms.length && ['integrated', 'done', null, 'claimed', 'reviewing', 'parked', 'active'].includes(st))
      need('returned_mention', { id: key + ':returned_mention', title: (t.jira === JIRA.returned ? 'Returned: you were mentioned' : 'You were mentioned'), reason: ms[ms.length - 1].who + ' mentioned you on ' + key + ' (' + ms.length + ' unseen comment' + (ms.length > 1 ? 's' : '') + ').', info: true, act: { do: 'open', key, tab: 'overview' }, hash: 'm' + ms.length });
    if (t.jira === JIRA.review && (st === 'integrated' || st === 'done') && !t.newCommits && draftOf(t, 'comment') && draftOf(t, 'comment').status === 'posted' && t.merges.length)
      need('returned_to_review', { id: key + ':returned_to_review', title: 'Back in the Review column', reason: key + ' returned to Review after alpha. Treat it as new: claim it again.', act: { do: 'reclaim', key }, hash: 'rr' });

    if (!st && t.jira === JIRA.review) continue;   // unclaimed handled by claim_new below
    if (st === 'claimed') need('start_review', { id: key + ':start_review', title: 'Start the review', reason: key + ' is claimed. Read its ' + t.prs.length + ' PR' + (t.prs.length > 1 ? 's' : '') + ' against ' + [...new Set(t.prs.map((p) => p.dst))].join(', ') + '.', act: { do: 'startReview', key }, hash: 's' });
    if (st === 'reviewing' && !t.reviewed) need('finish_review', { id: key + ':finish_review', title: 'Finish the review', reason: 'Review in progress. Mark it reviewed when the diffs and comments are done.', act: { do: 'open', key, tab: 'review' }, hash: 'f' });
    if (t.reviewed && t.prs.some((p) => p.updatedSeq > t.reviewedSeq) && ['reviewing', 'parked', 'claimed'].includes(st))
      need('re_review', { id: key + ':re_review', title: 'Re-review: new commits', reason: 'The branches moved since you reviewed ' + key + '.', act: { do: 'startReview', key }, hash: 'rv' + Math.max(...t.prs.map((p) => p.updatedSeq)) });

    if (!act && t.reviewed && ['reviewing', 'parked'].includes(st) && t.jira !== JIRA.returned)
      need('activate_reviewed', { id: key + ':activate', title: hot ? 'Activate hotfix (choose baseline)' : 'Activate for local test', reason: 'Reviewed' + (st === 'parked' ? ' and parked' : '') + '. Nothing is active. This switches the touched repos to the ticket branches and stashes local changes.', act: { do: 'activate', key }, hash: 'a' });
    if (act && act.key !== key && hot && t.reviewed && ['reviewing', 'parked'].includes(st))
      push_({ id: act.key + ':park_active:' + key, ticket: act.key, rule: 'park_active', hotfix: true, title: 'Park ' + act.key + ' for the hotfix ' + key, reason: key + ' is a hotfix waiting to be tested. Parking restores the repos and reverts the overlay.', act: { do: 'park', key: act.key }, hash: 'pa' });

    if (st === 'active') {
      const done = t.checklist.length > 0 && t.checklist.every((c) => c.done); const pushed = touchedRepos(t).every((p) => t.merges.some((m) => m.repo === p.repo));
      const prepped = t.prep && t.prep.rows.some((r) => r.outcome === 'conflict' || r.outcome === 'blocked');
      if (done && !t.prep && !pushed) need('integrate_ready', { id: key + ':integrate_ready', title: 'Prepare integration to uat', reason: 'Checklist complete (' + t.checklist.length + ' of ' + t.checklist.length + '). ' + touchedRepos(t).length + ' repo' + (touchedRepos(t).length > 1 ? 's' : '') + ' touched. Preparing pushes nothing.', act: { do: 'prepare', key }, hash: 'i' });
      if (t.prep && prepPushable(t)) need('push_ready', { id: key + ':push_ready', title: 'Review and push to uat', reason: 'Merge ready in ' + t.prep.rows.filter((r) => r.outcome === 'ready').map((r) => r.repo).join(', ') + '. Pushing deploys to alpha.', level: 'external', act: { do: 'pushAsk', key }, hash: 'p' + t.prep.at });
      if (prepped) t.prep.rows.filter((r) => r.outcome === 'conflict' || r.outcome === 'blocked').forEach((r) => need('integration_blocked', { id: key + ':blocked:' + r.repo, title: r.outcome === 'conflict' ? 'Resolve the uat conflict in ' + r.repo : 'Integration blocked in ' + r.repo, reason: r.outcome === 'conflict' ? 'Merging into uat conflicts with ' + r.with + ' in ' + r.files.join(', ') + '. Nothing was pushed.' : r.reason, info: true, act: { do: 'open', key, tab: 'ship' }, hash: r.outcome + r.repo }));
    }

    // A returned ticket is only your business if you are mentioned (handled above) or it fails to deploy.
    const sentBack = t.jira === JIRA.returned;
    if (t.merges.length) {
      for (const m of anyFailed(t)) {
        const d = t.deploy[m.repo];
        need('deploy_failed', { id: key + ':deploy_failed:' + m.repo, title: 'Deploy failed in ' + m.repo, reason: 'The deploy step of pipeline #' + d.run + ' failed after your push to uat.', info: false, level: 'external', needs: 'bkt', act: { do: 'rerunAsk', key, repo: m.repo }, hash: 'df' + d.run });
      }
      if (sentBack) continue;

/* ---------------- ticket detail ---------------- */
function ticketHead(t, tab) {

  const tabs = ['overview', 'review', 'test', 'ship', 'timeline'];

}

/* ---- review ---- */
function diffView(t, pr, fi) {

      '<div class="lab">If you activate now</div><div class="tbwrap"><table class="tbl"><tbody>' + plan.rows.map((r) => '<tr><td class="mono">' + r.repo + '</td><td>' + (r.role === 'ticket' ? pill('ticket branch', 'acc') : pill('baseline', '')) + '</td><td class="mono">' + esc(r.branch) + '</td><td class="faint small">was ' + esc(S.ws.branches[r.repo]) + (S.ws.dirty[r.repo] ? ', local changes stashed' : '') + '</td></tr>').join('') + '</tbody></table></div>' +

/* ---- ship ---- */
function pipeChip(t, repo) {

  return pill((d.state === 'deployed' ? '● deployed alpha' : d.state === 'failed' ? '✕ failed' : '◐ ' + d.state), cls) + ' <span class="faint small">#' + d.run + (d.state === 'running' || d.state === 'pending' ? ' · ' + d.step : '') + '</span>';
}

  const step4 = d && d.status === 'posted' ? (t.jira === JIRA.alpha || isSignedOff(t) ? '<div>' + pill(t.jira, jiraCls(t.jira)) + '</div>' : '<div class="row"><span>' + JIRA.review + ' → ' + JIRA.alpha + '</span>' + btn('Transition…', 'transitionAsk', { key: t.key }, 'p') + '</div>') : '<div class="mute">After the comment is posted.</div>';

  return '<div class="steps">' + stepBox(1, 'Integrate to uat', s1, step1) + stepBox(2, 'Pipelines', t.merges.length ? (fails.length ? 'bad' : dep ? 'done' : 'now') : '', step2) + stepBox(3, 'Deploy comment', d ? (d.status === 'posted' ? 'done' : 'now') : dep ? 'now' : '', step3) + stepBox(4, 'Move ticket', d && d.status === 'posted' ? (t.jira === JIRA.alpha || isSignedOff(t) ? 'done' : 'now') : '', step4) + stepBox(5, 'After alpha', isSignedOff(t) ? 'now' : '', step5) + '</div>';
}

/* ---------------- what is on uat ---------------- */
function viewEnv() {
  const cols = Object.keys(REPOS).filter((r) => r !== 'docs' || S.tickets.some((t) => t.merges.some((m) => m.repo === 'docs')));
  const per = (repo) => S.tickets.filter((t) => t.merges.some((m) => m.repo === repo)).map((t) => ({ t, m: t.merges.find((m) => m.repo === repo), d: t.deploy[repo] }));
  const overlaps = [];
  for (const repo of cols) { const list = per(repo); for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) { const a = list[i].t.prs.filter((p) => p.repo === repo).flatMap((p) => p.files.map((f) => f.path)); const b = list[j].t.prs.filter((p) => p.repo === repo).flatMap((p) => p.files.map((f) => f.path)); a.filter((f) => b.includes(f)).forEach((f) => overlaps.push({ repo, a: list[i].t.key, b: list[j].t.key, file: f })); } }
  return '<h2>On uat</h2><p class="lede">uat accumulates tickets, so what is deployed to alpha is the sum of everything merged. Check this before pushing: two tickets touching the same file can behave differently together.</p>' +
    '<div class="colsgrid">' + cols.map((repo) => { const list = per(repo); return '<section class="envcol"><div class="row sb"><h3 class="mono">' + repo + '</h3><span class="pill">' + REPOS[repo].host + '</span></div>' + (list.length ? list.map(({ t, m, d }) => '<div class="envit"><div class="row sb"><a href="#" class="key" data-act="go" data-name="ticket" data-key="' + t.key + '" data-tab="ship">' + t.key + '</a><span class="mono faint small">' + m.commit + '</span></div><div class="small">' + esc(t.title) + '</div><div class="row small">' + (d ? pipeChip(t, repo) : '') + ' ' + pill(t.jira, jiraCls(t.jira)) + '</div></div>').join('') : '<div class="faint">Nothing merged by you.</div>') + '</section>'; }).join('') + '</div>' +
    '<section class="sec"><h3>Potential overlap</h3>' + (overlaps.length ? overlaps.map((o) => '<div class="warn-box"><b>' + o.repo + '</b>: ' + o.a + ' and ' + o.b + ' both change <span class="mono">' + esc(o.file) + '</span>.</div>').join('') : '<div class="faint">No overlapping files between tickets on uat.</div>') + '<div class="faint small">Idea: warn about this before a ticket is prepared, not after.</div></section>';
}

    risk: 'high', title: 'Push to uat', ticket: key, need: key, auditName: 'git.push_uat',
    lead: 'This will run, exactly:', payload: rows.map((r) => r.repo.padEnd(11) + ' git push origin ' + r.merge + ':refs/heads/uat'),
    details: rows.map((r) => ({ a: r.repo, b: 'uat ' + r.uatBefore + ' → ' + r.merge, c: '+' + r.commits + ' commits · ' + r.files + ' files' })),
    checks: ['overlay guard ✓ (by SHA)', 'no overlay in worktree ✓', 'no force'], warn: 'Pushing deploys to alpha. Nothing has been sent yet.',

      .concat(S.tickets.map((t) => ({ l: t.key + '  ' + t.title, a: { name: 'ticket', key: t.key, tab: 'overview' } }))).filter((i) => !q || i.l.toLowerCase().includes(q)).slice(0, 9);
    return '<div class="sheet pal"><input id="palq" class="in big" placeholder="Jump to a ticket or screen…" data-bind="palq:0" value="' + esc(sh.q || '') + '" autocomplete="off"><div class="pal-l">' + items.map((i) => '<button class="pi" data-act="go"' + attr(i.a) + '>' + esc(i.l) + '</button>').join('') + '</div></div>';

}

/* ---------------- progress sheet (visual only; state already changed) ---------------- */
function runProgress(title, steps, summary) {
  const sh = { kind: 'progress', title, steps: steps.map((s) => Object.assign({ st: 'wait' }, s)), done: false, summary };

    if (i < sh.steps.length) { sh.steps[i].st = 'run'; i++; render(); setTimeout(tick, 420); }

}
function activationSteps(res) {

}

/* ---------------- action dispatcher ---------------- */

}

const TEXTINPUT = (name, val) => {

/* ---------------- simulate drawer ---------------- */
function devPanel() {

  const on = (v) => (v ? 'p' : '');
  const act = activeTicket();
  const anyInt = S.tickets.find((t) => status(t) === 'integrated' && t.merges.length) || S.tickets.find((t) => status(t) === 'integrated');
  const key = anyInt ? anyInt.key : 'PROJ-142';

    btn('Offline', 'sim', { k: 'offline' }, on(S.sim.offline) + ' sm') + btn('bkt signed out', 'sim', { k: 'bkt' }, on(!S.providers.bkt.ready) + ' sm') + btn('acli signed out', 'sim', { k: 'jira' }, on(!S.providers.jira.ready) + ' sm') + '</div>' +

}

/* ---------------- render ---------------- */
function toasts() { return '<div class="toasts">' + S.ui.toasts.slice(-4).map((t) => '<div class="toast ' + t.kind + '">' + esc(t.msg) + '</div>').join('') + '</div>'; }
function layout() {
  return '<div class="app ' + (S.ui.right ? '' : 'noright ') + (S.ui.left ? 'showleft' : '') + '"><aside class="left">' + leftNav() + '</aside><div class="center">' + topBar() + nowBar() + '<main class="content">' + mainView() + '</main></div><aside class="right">' + rightPanel() + '</aside></div>' +
    (S.ui.sheet ? '<div class="scrim" data-act="scrim"></div>' + sheetBody() : '') + devPanel() + toasts();
}
function sig() { const r = S.ui.route; return r.name + ':' + (r.key || '') + ':' + (r.tab || '') + ':' + (r.group || ''); }

function render() {

  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } } }

}

/* ---------------- boot ---------------- */

    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;

    if (el.tagName === 'A') e.preventDefault();
    if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
    const d = {}; for (const a of el.attributes) if (a.name.startsWith('data-') && a.name !== 'data-act') d[a.name.slice(5)] = a.value;
    if (ACT[act]) { ACT[act](d, el); render(); }

    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.type === 'checkbox' || el.type === 'radio') { const act = el.getAttribute('data-act'); const d = {}; for (const a of el.attributes) if (a.name.startsWith('data-') && a.name !== 'data-act') d[a.name.slice(5)] = a.value; if (ACT[act]) { ACT[act](d, el); render(); } }
  });

    if (e.key === 'Enter' && e.target && e.target.id === 'chkadd') { const key = S.ui.route.key; ACT.addChk({ key }); render(); }
  });

  setInterval(() => {
    advance(500);
    const ae = document.activeElement; const typing = ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'checkbox' && ae.type !== 'radio'));
    if (!typing && !(S.ui.sheet && S.ui.sheet.kind === 'progress')) render();
  }, 500);
}
