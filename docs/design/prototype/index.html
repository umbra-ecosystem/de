<title>de</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Zed-like: flat dark surfaces, 1px dividers, dense 13px UI, small radii, tab strip, status bar. */
:root{
  --bg:#282c33; --panel:#2f343e; --surface:#282c33; --title:#3b414d; --ink:#dce0e5; --mute:#a9afbc; --faint:#878a98;
  --line:#363c46; --line-strong:#464b57; --fill:#363c46; --hover:#2f343e; --sel:#454a56;
  --accent:#74ade8; --accent-ink:#1b2028; --accent-soft:#2f3b4d;
  --ok:#a1c181; --ok-soft:#2b3a2b; --warn:#dec184; --warn-soft:#3d3524; --bad:#d07277; --bad-soft:#3f2b2e; --bad-ink:#1b2028;
  --dim:rgba(0,0,0,.45); --diff-add:#243328; --diff-del:#3a2629;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#fafafa; --panel:#ebebec; --surface:#fafafa; --title:#dcdcdd; --ink:#242529; --mute:#575a66; --faint:#7b7e8a;
  --line:#dfdfe1; --line-strong:#c9c9cc; --fill:#e4e4e6; --hover:#ebebec; --sel:#d5d6da;
  --accent:#3b7bd6; --accent-ink:#fff; --accent-soft:#dbe6f6;
  --ok:#3f7d3a; --ok-soft:#dcebd9; --warn:#946a12; --warn-soft:#f3e8cc; --bad:#c0353d; --bad-soft:#f6dcdd; --bad-ink:#fff;
  --dim:rgba(0,0,0,.25); --diff-add:#e3f1de; --diff-del:#f8e1e1; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#fafafa; --panel:#ebebec; --surface:#fafafa; --title:#dcdcdd; --ink:#242529; --mute:#575a66; --faint:#7b7e8a;
  --line:#dfdfe1; --line-strong:#c9c9cc; --fill:#e4e4e6; --hover:#ebebec; --sel:#d5d6da;
  --accent:#3b7bd6; --accent-ink:#fff; --accent-soft:#dbe6f6;
  --ok:#3f7d3a; --ok-soft:#dcebd9; --warn:#946a12; --warn-soft:#f3e8cc; --bad:#c0353d; --bad-soft:#f6dcdd; --bad-ink:#fff;
  --dim:rgba(0,0,0,.25); --diff-add:#e3f1de; --diff-del:#f8e1e1; color-scheme:light;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
textarea,input,.prose,.code,.diff,.cbody{user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit;text-decoration:none}
h2,h3,h4,h5{margin:0;font-weight:500}
:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-size:12px}.key{font-family:var(--mono);font-size:12px;color:var(--accent)}
a.key:hover{text-decoration:underline}
.mute{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:12px}
.pad{padding:4px 0}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.row.sb{justify-content:space-between;flex-wrap:nowrap}.row.wrap{flex-wrap:wrap}
.sp,.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:6px}
#root{height:100dvh}

/* ---- window ---- */
.win{display:flex;flex-direction:column;height:100dvh}
.tb{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;background:var(--title);border-bottom:1px solid var(--line);flex:none}
.lights{display:flex;gap:8px;margin-right:6px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tt-name{font-family:var(--mono);font-weight:600;color:var(--mute)}
.search{display:flex;gap:24px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line-strong);border-radius:4px;padding:2px 8px;color:var(--faint);min-width:300px;height:22px;font-size:12px}
.search:hover{color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;color:var(--faint)}
.icon{background:transparent;border:0;border-radius:4px;padding:2px 8px;color:var(--mute);font-size:12px;height:22px}
.icon:hover,.icon.on{background:var(--fill);color:var(--ink)}
.mob{display:none}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;flex:1;min-height:0}
.app.noright{grid-template-columns:220px minmax(0,1fr)}
.app.noright .right{display:none}
.left,.right{overflow:auto;background:var(--panel);min-height:0}
.left{border-right:1px solid var(--line);padding:4px 0}
.right{border-left:1px solid var(--line);padding:4px 0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.content{overflow:auto;flex:1;padding:14px 20px 40px}
.ph{padding:10px 12px 3px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.nav{display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 12px;margin:0 4px;border-radius:4px;color:var(--mute)}
.nav b{font-weight:400;font-size:11px;color:var(--faint);font-family:var(--mono)}
.nav:hover{background:var(--fill);color:var(--ink)}
.nav.on{background:var(--sel);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.warn-t{color:var(--warn)}

/* ---- tab strip and status bar ---- */
.tabstrip{display:flex;align-items:stretch;height:32px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;color:var(--mute);border-right:1px solid var(--line);white-space:nowrap;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--bg);color:var(--ink);margin-bottom:-1px;height:33px}
.tab .key{color:var(--ink)}.tab .ct{color:var(--mute);max-width:16ch;overflow:hidden}
.tab.pv .key,.tab.pv .ct{font-style:italic}
.tab .x{background:transparent;border:0;color:var(--faint);width:16px;height:16px;line-height:14px;border-radius:3px;padding:0;margin-right:-6px;opacity:0}
.tab:hover .x,.tab.on .x{opacity:1}.tab .x:hover{background:var(--fill);color:var(--ink)}
.tplay{color:var(--accent);font-size:10px}
.seg{margin:10px 0 0;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabcrumb-unused{display:flex;align-items:center;padding:0 12px;gap:8px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.tabcrumb .ct{overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:8px;height:24px;padding:0 6px;background:var(--title);border-top:1px solid var(--line);font-size:12px;color:var(--mute);flex:none}
.sbl{display:flex;align-items:center;gap:2px}
.sbi{display:inline-flex;align-items:center;gap:6px;padding:1px 7px;border-radius:4px}
a.sbi:hover{background:var(--fill);color:var(--ink)}
.sbi.hl{color:var(--accent)}.sbi.warnb{color:var(--warn)}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:4px;border:1px solid var(--line-strong);background:var(--panel);font-size:12px;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--fill)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.p:hover:not(:disabled){filter:brightness(1.1);background:var(--accent)}
.btn.d{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.g{background:transparent;border-color:transparent;color:var(--mute)}
.btn.sm{height:20px;padding:0 7px;font-size:11.5px}
.btn:disabled{opacity:.4}
.lnk{color:var(--accent)}.lnk:hover{text-decoration:underline}
.pill{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;background:var(--fill);color:var(--mute);white-space:nowrap;line-height:17px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.hot{background:var(--bad);color:var(--bad-ink)}
.card{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--panel)}
.card.overlay{background:var(--warn-soft);border-color:var(--warn);margin-top:8px}
.warn-box{border-left:2px solid var(--warn);background:var(--warn-soft);padding:5px 10px;margin:6px 0}
.empty{color:var(--faint);padding:20px 0}
.empty.left{padding:0}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute)}
.chk.big{color:var(--ink);padding:4px 0}
.strike{text-decoration:line-through;color:var(--faint)}
.radio{display:flex;gap:8px;align-items:center;padding:4px 0}
.in,textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:4px;padding:4px 8px;font:inherit}
.in:focus,textarea:focus{outline:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
textarea.mono{font-family:var(--mono);font-size:12px}
.in{width:auto;min-width:160px}.in.big{width:100%;font-size:14px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}.in.ro{display:inline-block;color:var(--mute)}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:12px 0 4px}
h2{font-size:16px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px;font-weight:500}
h4{font-size:13px;margin:10px 0 3px}
.dotnew{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.spin{width:10px;height:10px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- tables and tabs ---- */
.tbwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;color:var(--faint);font-weight:400;padding:3px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hover{cursor:pointer}.tbl tr.hover:hover td{background:var(--hover)}
.tabs{display:flex;gap:2px;margin:0 0 10px;flex-wrap:wrap}
.tabs a{padding:2px 8px;border-radius:4px;color:var(--mute);white-space:nowrap}
.tabs a:hover{background:var(--fill);color:var(--ink)}
.tabs a.on{background:var(--sel);color:var(--ink)}
.tabs a b{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:4px;padding:1px 8px;font-family:var(--mono);font-size:12px}
.chip.on{background:var(--sel)}

/* ---- next / suggestions ---- */
.card.sug{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.card.sug.res{border-color:var(--accent)}
.card.sug.muted{opacity:.5}
.rk{color:var(--faint);font-family:var(--mono);font-size:11px;padding-top:1px}
.sug .tt{font-weight:500}
.why{color:var(--mute);margin:2px 0 6px}

/* ---- ticket ---- */
.thead{margin-bottom:12px}
.thead .tt2{margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.col{min-width:0}.sec{margin-bottom:16px}
.prose p{margin:0 0 6px;max-width:80ch}.prose ul{margin:0 0 6px;padding-left:18px}
.code{font-family:var(--mono);font-size:12px;background:var(--panel);border-radius:4px;padding:6px 8px;white-space:pre-wrap;word-break:break-word;margin:4px 0}
ul.ac{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.cmt{border-left:2px solid var(--line-strong);padding:2px 0 2px 10px;margin-bottom:10px}
.cmt.new{border-color:var(--accent)}
.cbody p{margin:2px 0 0}
.av{width:18px;height:18px;border-radius:50%;background:var(--fill);color:var(--mute);font-size:9px;display:grid;place-items:center;flex:none}
.mention{color:var(--accent)}.mention.me{background:var(--accent-soft);border-radius:3px;padding:0 3px}
.url{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.composer{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.att{display:flex;gap:8px;align-items:center;padding:3px 0}.fileic{color:var(--faint)}
.qi{padding:5px 0;border-bottom:1px solid var(--line)}.qi:last-child{border-bottom:0}
.stepper{list-style:none;display:flex;gap:0;padding:0;margin:10px 0 0;overflow-x:auto}
.stepper li{flex:1;min-width:64px;text-align:center;position:relative;font-size:11px;color:var(--faint);padding-top:12px}
.stepper li i{position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:var(--line-strong);z-index:1}
.stepper li::before{content:"";position:absolute;top:3px;left:-50%;width:100%;height:1px;background:var(--line-strong)}
.stepper li:first-child::before{display:none}
.stepper li.done{color:var(--mute)}.stepper li.done i,.stepper li.done::before{background:var(--ok)}
.stepper li.now{color:var(--ink)}.stepper li.now i{background:var(--accent)}.stepper li.now::before{background:var(--ok)}

/* ---- review ---- */
.prhead{padding:4px 0 8px;display:flex;flex-direction:column;gap:2px}
.rvgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px}
.ftree{display:flex;flex-direction:column;font-size:12px}
.fl{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:transparent;border:0;border-radius:4px;padding:3px 8px;word-break:break-all}
.fl:hover{background:var(--fill)}.fl.on{background:var(--sel)}
.fl em{font-style:normal;font-family:var(--mono);font-size:11px}.ad{font-style:normal;color:var(--ok)}.dl2{font-style:normal;color:var(--bad)}
.fpath{margin-bottom:4px}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;overflow:auto;background:var(--bg)}
.dl{display:grid;grid-template-columns:38px 38px 16px minmax(0,1fr) 28px;padding:0 6px;white-space:pre;position:relative}
.dl code{font-family:inherit;white-space:pre-wrap;word-break:break-word}
.dl.add{background:var(--diff-add)}.dl.del{background:var(--diff-del)}
.dl .ln{color:var(--faint);text-align:right;padding-right:8px;user-select:none}
.dl .sg{color:var(--mute)}
.dl .plus{opacity:0;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;width:18px;height:16px;line-height:14px;align-self:center;padding:0}
.dl:hover .plus{opacity:1}
.thread{font-family:var(--ui);font-size:12px;margin:3px 10px 5px 80px;border:1px solid var(--line-strong);border-radius:4px;padding:6px 8px;background:var(--panel);white-space:normal}
.thread.new{border-color:var(--accent)}
.rvbar{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}

/* ---- ship ---- */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11px;color:var(--mute)}
.step.now .n{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step.done .n{border-color:var(--ok);color:var(--ok)}
.step.bad .n{border-color:var(--bad);color:var(--bad)}
.sb2{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---- uat contents ---- */
.colsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.envcol{border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.envit{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}

/* ---- right panel ---- */
.rc{padding:6px 12px 10px;border-bottom:1px solid var(--line)}
.rc:last-child{border-bottom:0}
.rc h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:5px;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;padding:1px 0;align-items:baseline}
.kv span{color:var(--mute);flex:none}.kv b{font-weight:400;text-align:right;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
ul.act,ul.rep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
ul.act li{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}ul.act em{font-style:normal;color:var(--mute);font-family:var(--mono);font-size:11px}
ul.rep li{display:flex;gap:6px;align-items:baseline}

/* ---- sheets ---- */
.scrim{position:fixed;inset:0;background:var(--dim);z-index:40}
.sheet{position:fixed;z-index:50;left:50%;top:9vh;transform:translateX(-50%);width:min(560px,94vw);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:flex;flex-direction:column}
.sheet.wide{width:min(720px,94vw)}
.sheet.pal{top:12vh}
.pal-l{display:flex;flex-direction:column;padding:4px}.pi{text-align:left;background:transparent;border:0;padding:4px 10px;border-radius:4px}.pi:hover,.pi:focus{background:var(--sel);outline:0}
.sh-h{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.sh-h.high{background:var(--bad-soft);color:var(--bad)}
.sh-h.medium{background:var(--warn-soft);color:var(--warn)}
.sh-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sh-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:8px;position:sticky;bottom:0;background:var(--panel)}
.ps{display:flex;gap:8px;align-items:baseline;color:var(--faint)}.ps i{font-style:normal;width:14px;text-align:center}
.ps.run{color:var(--ink)}.ps.ok{color:var(--ink)}.ps.ok i{color:var(--ok)}.ps.warn i{color:var(--warn)}
.dev{position:fixed;z-index:45;right:10px;bottom:34px;width:min(300px,92vw);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;padding:8px 12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dev .lab{margin:10px 0 4px}
.toasts{position:fixed;z-index:60;right:12px;bottom:34px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.toast{background:var(--title);border:1px solid var(--line-strong);color:var(--ink);border-radius:4px;padding:5px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.ok{border-left:3px solid var(--ok)}.toast.bad{border-left:3px solid var(--bad)}.toast.warn{border-left:3px solid var(--warn)}

@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.app .right{display:none}.grid3{grid-template-columns:1fr}}
@media (max-width:820px){
  .app,.app.noright{grid-template-columns:minmax(0,1fr)}
  .left{position:fixed;z-index:30;left:0;top:34px;bottom:24px;width:230px;transform:translateX(-102%);transition:transform .15s;border-right:1px solid var(--line-strong)}
  .showleft .left{transform:none}
  .mob{display:inline-block}.lights{display:none}.search{min-width:0;gap:8px}
  .grid2,.rvgrid{grid-template-columns:minmax(0,1fr)}
  .content{padding:12px 12px 32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.narrow-only{display:none}
.app.noright .narrow-only{display:block}
@media (max-width:1180px){.narrow-only{display:block}}

/* ---- attention ---- */
.bdg{background:var(--bad);color:var(--bad-ink);border-radius:8px;padding:0 5px;font-size:11px;font-weight:500;margin-left:3px}
.sbi.badb{color:var(--bad)}
.attn-scrim{position:fixed;inset:0;z-index:44}

/* ---------------- progress sheet (visual only; state already changed) ---------------- */
function runProgress(title, steps, summary) {
  const sh = { kind: 'progress', title, steps: steps.map((s) => Object.assign({ st: 'wait' }, s)), done: false, summary };
  S.ui.sheet = sh; let i = 0;
  const tick = () => {
    if (S.ui.sheet !== sh) return;
    if (i > 0 && sh.steps[i - 1]) sh.steps[i - 1].st = sh.steps[i - 1].warn ? 'warn' : 'ok';
    if (i < sh.steps.length) { sh.steps[i].st = 'run'; i++; render(); setTimeout(tick, 420); }
    else { sh.done = true; render(); }
  };
  if (IS_BROWSER) setTimeout(tick, 200); else { sh.steps.forEach((s) => { s.st = 'ok'; }); sh.done = true; }
}
function activationSteps(res) {
  const out = res.rows.map((r) => ({ repo: r.repo, text: (r.role === 'ticket' ? 'switched to ' : 'baseline ') + r.branch + (S.tk_stash && S.tk_stash[r.repo] ? '' : '') }));
  res.records.filter((r) => r.stash).forEach((r) => out.push({ repo: r.repo, text: 'local changes stashed as “' + r.label + '”' }));
  if (res.overlay) { out.push({ repo: res.overlay.repo, text: 'composer path repository → ../' + res.overlay.provider + ', constraint “*”' }); out.push({ repo: res.overlay.repo, text: 'composer update, rebuild build-ui' }); }
  return out;
}
