[package]
name = "de"
description = "A simple CLI for managing isolated development environments with Docker Compose."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
de-core.workspace = true
de-gui = { path = "../gui" }

axoupdater.workspace = true
clap.workspace = true
color-eyre.workspace = true
console.workspace = true
dialoguer.workspace = true
directories.workspace = true
eyre.workspace = true
indicatif.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
de-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true

# Publishing the desktop app: `cargo bundle` reads this to build Deus.app
# (the `de` binary inside keeps the tool name). Icon: assets/icon/Deus.icns
# is a placeholder mark; the generator beside it makes a new one.
[package.metadata.bundle]
name = "Deus"
identifier = "dev.umbra.deus"
icon = ["../../assets/icon/Deus.icns"]
category = "Developer Tool"
short_description = "A calm desk for Jira reviews, local testing and releases."
